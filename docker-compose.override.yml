services:
  db_clickhouse:
    image: clickhouse/clickhouse-server:25.8 #LTS

    ports:
      - "8125:8123" #HTTP
      - "9003:9000" #TCP

    volumes:
      - clickhouse_data:/var/lib/clickhouse # magazzino gestito da docker perchè senza /
      # Se docker vede "/" => percorso

    env_file:
      - .env #environment non andava bene perchè docker compose non lo lancio io a mano ma astro

    networks:
      - airflow 

    # ClickHouse richiede un numero elevato di file aperti, per questo aumentiamo "Usage Limits"
    # Su una macchina potente potremmo aumentare anche il numero di processi, e memlock ma per ora lasciamo quello di default
    ulimits:
      nofile:
        soft: 262144
        hard: 262144    

    # Verifichiamo che il container sia pronto a rispondere prima di considerarlo su
    # Spider non salva file, no-verbose non sporchia i log
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  clickhouse_data: # presento il magazzzino a docker in modo che lui possa usarlo
  # il magazzino ha lo stesso nome del volume