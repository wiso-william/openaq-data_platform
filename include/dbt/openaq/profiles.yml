# Sta nella cartella del progetto e non in ~/.dbt/ cosi clonando il progetto si ha tutto già descritto
openaq:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'db_clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"

      schema: "{{ env_var('CLICKHOUSE_ANALYTICS_DATABASE', 'openaq_analytics') }}"

      secure: false
      threads: 4